name: Release

on:
  push:
    tags: ["v*"]
  # Manual "test build" from the Actions tab: builds all three, publishes nothing.
  workflow_dispatch:

# Read-only by default: the build jobs run third-party npm install scripts, so they get no write access.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false # one OS failing shouldn't cancel the others
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # don't leave the token in .git/config for later steps
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Builds for the runner's own OS. --publish never: the release job below uploads.
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error

  # One job creates the release, so the three builds don't race to create it.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job can create the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # Third-party action with write access: pinned to an exact commit (v3.0.4) so a moved tag can't swap the code.
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          files: dist/*
